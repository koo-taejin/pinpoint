name: it-command
on:
  repository_dispatch:
    types: [it-command]
    
jobs:
  example:
    runs-on: ubuntu-20.04
    env:
      PR_NUMBER: ${{ github.event.client_payload.github.payload.issue.number }}
      PR_P: ${{ github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: 'refs/pull/${{ env.PR_NUMBER }}/merge'
      - name: Set up JDK 7
        uses: actions/setup-java@v1
        with:
          java-version: 7
      - name: Set up JDK 9
        uses: actions/setup-java@v1
        with:
          java-version: 9
      - name: Set JAVA_HOME
        run: |
          echo "JAVA_7_HOME=$JAVA_HOME_7_0_312_X64" >> $GITHUB_ENV
          echo "JAVA_8_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          echo "JAVA_9_HOME=$JAVA_HOME_9_0_7_X64" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
      - name: Java Environment
        run: env | grep '^JAVA'
      - name: Cache Maven packages
        uses: actions/cache@v2
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build with Maven
        run: ./mvnw --batch-mode clean install -DskipTests -pl agent -am -f pom.xml
      - name: Build Plugin Bom
        working-directory: ./plugins/bom
        run: ../../mvnw clean install
      - name: Build plugin IT utils
        working-directory: ./plugins-it
        run: ../mvnw clean install -Pit-module -pl plugin-it-utils
      - name: Integration Test
        working-directory: ./plugins-it
        run: ../mvnw --batch-mode clean install -Pit-module -pl ${{ github.event.client_payload.slash_command.args.all }}
